    if(!session?.user?.email||session.user.is_anonymous)return {user:null,session:null};
    // Les anciennes connexions par courriel ne sont plus utilisées : repartir sur le système pseudo + mot de passe.
    if(!session.user.email.toLowerCase().endsWith('@login.geleeroyale.invalid')){
      await grClient.auth.signOut();

  async function grPseudoLoginId(nickname){
    const normalized=String(nickname||'').trim().normalize('NFKC').toLocaleLowerCase('fr-CA');
    const bytes=new TextEncoder().encode(normalized);
    const digest=await crypto.subtle.digest('SHA-256',bytes);

  // Classement : cette page affiche honnêtement les statistiques de cet appareil.
  // Le classement mondial nécessite une table sécurisée Supabase (pas de faux joueurs).
  T.ranking=()=>`<div class="big">🏆</div><h3>Classement</h3>

    <p class="sm">Le classement mondial entre comptes sera activé après la création de la table de classement dans Supabase.</p>${btn('home','Retour','alt')}`;

  // Ecran d'accueil : pseudo seulement, comme dans la version originale.
  T.welcome=()=>`<div class="big">👋</div><h3>Bienvenue dans Gelo Royal !</h3>
    <p class="sm">Choisis ton nom d’utilisateur pour commencer à jouer.</p>
    <input id="account-name" maxlength="14" autocomplete="nickname" placeholder="Ton nom d’utilisateur">
    <p id="account-status" class="sm">Ta progression sera sauvegardée automatiquement sur cet appareil.</p>
    <div class="row">${btn('account_play','Jouer !')}</div>`;

  const priorHomeUI=T.home;
  T.home=()=>priorHomeUI()+`<div class="row">${btn('season','🎟️ Passe de saison','alt')}${btn('ranking','🏆 Classement','alt')}${btn('online','🌐 En ligne','alt')}</div>`;

  // Admin : distribution des nouveaux coffres, en plus des coffres bois/dorés.
  const priorAdminUI=T.admin;
  T.admin=function(){
    const html=priorAdminUI();
    return html.replace("<h4>Bonbons exacts</h4>",
      `<h4>🎁 Donner les nouveaux coffres</h4>
       <div class="row">${btn('adminchest','+5 💎 Cristal','alt','data-k=crystal')}${btn('adminchest','+5 👑 Royaux','alt','data-k=royal')}</div>
       <h4>Bonbons exacts</h4>`);
  };

  const priorAction=act;
  act=function(a,d){
    // Navigation explicite vers les deux écrans ajoutés : ils n'existent pas
    // dans le gestionnaire d'origine, donc ils doivent être traités ici.
    if(a==='season'||a==='ranking'){go(a);return}
    if(a==='account_play'){
      const name=($('account-name')?.value||'').trim().slice(0,14);
      const status=$('account-status');
      if(name.length<2){if(status)status.textContent='Choisis un nom d’utilisateur de 2 caractères minimum.';return}
      S.nm=name;S.accountOk=true;save();go('home');return;
    }
    if(a==='seasonpremium'){
      if(!S.season.premium&&S.coins>=1500){S.coins-=1500;S.season.premium=true;save();coins(1)}
      go('season');return;
    }
    if(a==='seasonclaim'||a==='seasonclaimp'){
      const i=Number(d.i),tier=passTiers[i],premium=a==='seasonclaimp';
      if(tier&&passXP()>=tier.xp){
        const list=premium?S.season.claimedPremium:S.season.claimedFree;
        if(!list.includes(i)&&(!premium||S.season.premium)){
          list.push(i);passReward(premium?tier.premium:tier.free);save();coins(1);sfx('ok');
        }
      }
      go('season');return;
    }
    if(a==='adminchest'){
      if(!ADM)return;
      const k=d.k;
      if(k==='crystal'||k==='royal')S.cu.chests[k]=(S.cu.chests[k]||0)+5;
      save();go('admin');return;
    }
    return priorAction(a,d);
  };

  // Les récompenses de fin de partie peuvent faire gagner des coffres spéciaux.
  const finBeforeSpecialChest=fin;
  fin=function(win,rank){
    finBeforeSpecialChest(win,rank);
    if(g && g.md!=='training' && win && rank===1 && Math.random()<.28){
      const kind=Math.random()<.18?'royal':'crystal';
      S.cu.chests[kind]=(S.cu.chests[kind]||0)+1;
      if(RW)RW.push([kind==='royal'?'👑':'💎','Coffre '+(kind==='royal'?'royal':'cristal')+' gagné !']);
      save();
    }
  };

  // La zone de saisie du chat est explicitement sélectionnable/cliquable.
  const style=document.createElement('style');
  style.textContent=`#gr-message,#gr-room,#account-name{user-select:text!important;-webkit-user-select:text!important;pointer-events:auto!important;cursor:text}

  style.textContent+=`\n    #club-name,#club-description,#club-code{display:block!important;width:100%!important;max-width:100%;box-sizing:border-box;margin:10px 0!important;min-width:0}`;
  document.head.appendChild(style);

  // CLANS EN LIGNE : les clubs locaux sont maintenant reliés à Supabase.

  async function grLoadClan(){
    if(!window.grOnlineAPI.client||!window.grOnlineAPI.myId)throw new Error('Connexion Supabase pas encore prête.');

    catch(e){console.error('Création clan:',e);grClanStatus(e?.message||'Impossible de créer le clan.');}

  }
  async function grJoinClan(){
    const code=($('club-code')?.value||'').trim().toUpperCase();

    if(grClanBusy)return;grClanBusy=true;grClanStatus('Recherche du clan…');
    try{if(!window.grOnlineAPI.isReady())await window.grOnlineAPI.init();const {error}=await window.grOnlineAPI.client.rpc('gr_join_clan',{p_code:code});if(error)throw error;await grLoadClan();grClanStatus('Tu as rejoint le clan !');go('clubs');}
    catch(e){console.error('Rejoindre clan:',e);grClanStatus(e?.message||'Impossible de rejoindre ce clan.');}

  async function grLeaveClan(){

    try{if(!window.grOnlineAPI.isReady())await window.grOnlineAPI.init();const {error}=await window.grOnlineAPI.client.rpc('gr_leave_clan');if(error)throw error;window.grClanData=null;grClanStatus('Tu as quitté le clan.');go('clubs');}
    catch(e){console.error('Quitter clan:',e);grClanStatus(e?.message||'Impossible de quitter le clan.');}

  }
  T.clubs=()=>`<div class="big">🏆</div><h3>Les clans</h3><p class="sm">Les clans sont maintenant enregistrés en ligne : tous les joueurs peuvent se retrouver avec un code d’invitation.</p>${window.grClanData?`<div class="card" style="width:min(460px,100%);display:block"><b>🏅 ${esc(window.grClanData.name)}</b><p class="sm">${esc(window.grClanData.description||'Aucune description')}</p><p class="sm">Code d’invitation : <b style="font-size:1.25rem;letter-spacing:2px">${esc(window.grClanData.invite_code)}</b></p><p class="sm">Ton rôle : ${window.grClanData.role==='leader'?'👑 Chef du clan':'Membre'}</p>${window.grClanData.role==='leader'?'<p class="sm">Tu es le chef de ce clan. Les options de gestion du chef arriveront ensuite.</p>':btn('leaveclub','Quitter le clan','alt')}</div>`:`<div class="card" style="width:min(460px,100%);display:block"><b>Créer un clan</b><input id="club-name" maxlength="24" placeholder="Nom du clan (3 à 24 caractères)"><input id="club-description" maxlength="120" placeholder="Description (facultative)"><div class="row">${btn('createclub','Créer mon clan')}</div></div><div class="card" style="width:min(460px,100%);display:block"><b>Rejoindre un clan</b><input id="club-code" maxlength="8" placeholder="Code d’invitation (8 caractères)" style="text-transform:uppercase"><div class="row">${btn('joinclub','Rejoindre')}</div></div>`}<p id="gr-clan-status" class="sm">${window.grOnlineAPI.isReady()?'Connecté à Supabase.':'Connexion à Supabase…'}</p>${btn('home','Retour','alt')}`;
  const grClanOldAct=act;
  act=function(a,d){
    if(a==='clubs'){go('clubs');return;}
    if(a==='createclub'){grCreateClan();return;}
    if(a==='joinclub'){grJoinClan();return;}
    if(a==='leaveclub'){grLeaveClan();return;}
    return grClanOldAct(a,d);
  };
  const grClanOldGo=go;
  go=function(n){
    grClanOldGo(n);
    if(n==='clubs'){
      grClanStatus(window.grOnlineAPI.isReady()?'Chargement de ton clan…':'Connexion à Supabase…');
      const load=async()=>{
        if(!window.grOnlineAPI.isReady())await window.grOnlineAPI.init();
        await grLoadClan();
        // Rafraîchit l'écran sans rappeler ce wrapper et relancer le chargement.
        if($('gr-clan-status'))grClanOldGo('clubs');
        grClanStatus('Clan synchronisé avec Supabase ✓');
      };
      load().catch(e=>{
        console.error('Chargement clan:',e);
        grClanStatus('Erreur : '+(e?.message||String(e)));

  // Animation d'ouverture des coffres : couvercle, lueur, étincelles et récompenses.
  const chestThemes={wood:{icon:'🪵',name:'Coffre en bois'},gold:{icon:'🌟',name:'Coffre doré'},crystal:{icon:'💎',name:'Coffre cristal'},royal:{icon:'👑',name:'Coffre royal'}};
  T.rw=function(){
    if(RB==='chests'){
      const theme=chestThemes[chestVisual]||chestThemes.wood;
      return `<div class="chest-opening chest-${chestVisual}">
        <div class="chest-aura"></div><div class="chest-rays">✦　✧　✦　✧　✦</div>
        <div class="chest-emoji">${theme.icon}</div>

      <div class="list chest-rewards">${RW.map((r,i)=>`<div class="card reward-pop" style="--d:${i+1}"><span style="font-size:1.8rem">${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}</div>${btn('rb','Génial !')}`;
    }
    return `<div class='chest-pop'>${RB==='home'?'🎉':'🎁'}</div><h3>Récompenses</h3><div class='list'>${RW.map((r,i)=>`<div class='card reward-pop' style='--d:${i+1}'><span style='font-size:1.6rem'>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}</div>${btn('rb','OK')}`;
  };
  const chestStyle=document.createElement('style');
  chestStyle.textContent=`
    .chest-opening{position:relative;width:min(330px,90%);height:178px;display:flex;align-items:center;justify-content:center;flex:none;isolation:isolate}
    .chest-aura{position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(182,255,92,.55),transparent 70%);animation:chestAura 1.8s ease-out both;z-index:-1}
    .chest-rays{position:absolute;font-size:1.45rem;letter-spacing:5px;color:#fff4a8;opacity:0;animation:chestRays 1.1s .35s ease-out both}
    .chest-emoji{position:absolute;top:5px;font-size:2.4rem;filter:drop-shadow(0 4px 8px #0008);animation:chestEmoji 1s .12s both;z-index:3}
    .chest-3d{position:absolute;top:68px;width:116px;height:86px;filter:drop-shadow(0 12px 9px #0008);animation:chestBounce .65s .25s both}
    .chest-lid{position:absolute;left:5px;top:0;width:106px;height:35px;border:4px solid #713b1b;border-radius:13px 13px 5px 5px;background:linear-gradient(180deg,#e9ae55,#a85b27);transform-origin:12px 28px;z-index:2;animation:chestLidOpen .8s .45s cubic-bezier(.2,.8,.2,1) both}
    .chest-body{position:absolute;left:7px;top:25px;width:102px;height:57px;border:4px solid #713b1b;border-radius:5px 5px 14px 14px;background:repeating-linear-gradient(0deg,transparent 0 12px,#713b1b55 13px 15px),linear-gradient(135deg,#d9964c,#85431f);display:grid;place-items:center;color:#ffe58a;font-size:2rem;box-shadow:inset 0 7px 0 #ffffff20}
    .chest-body:before{content:'';position:absolute;left:42px;top:-3px;width:12px;height:55px;background:#f2c75b;border-left:2px solid #8a5b21;border-right:2px solid #8a5b21}
    .chest-sparks{position:absolute;bottom:0;font-size:1.25rem;letter-spacing:8px;color:#fff3a1;opacity:0;animation:chestSpark 1.1s .65s ease-out both}
    .chest-title{animation:chestTitle .45s .85s both}.chest-subtitle{animation:chestTitle .45s 1s both}
    .chest-rewards{width:min(440px,100%)}.chest-rewards .card{animation:chestReward .45s calc(1.05s + var(--d,1)*.16s) both}
    .chest-gold .chest-aura{background:radial-gradient(circle,rgba(255,211,84,.72),transparent 70%)}.chest-gold .chest-lid,.chest-gold .chest-body{background:linear-gradient(135deg,#ffe98a,#c68a22)}
    .chest-crystal .chest-aura{background:radial-gradient(circle,rgba(99,226,255,.72),transparent 70%)}.chest-crystal .chest-lid,.chest-crystal .chest-body{background:linear-gradient(135deg,#a8f5ff,#347bbd);border-color:#18547b}
    .chest-royal .chest-aura{background:radial-gradient(circle,rgba(255,95,168,.72),transparent 70%)}.chest-royal .chest-lid,.chest-royal .chest-body{background:linear-gradient(135deg,#ffb1df,#823bb2);border-color:#51236e}
    @keyframes chestAura{0%{transform:scale(.2);opacity:0}45%{opacity:1}100%{transform:scale(1.8);opacity:.75}}
    @keyframes chestRays{0%{opacity:0;transform:scale(.2) rotate(-25deg)}55%{opacity:1;transform:scale(1.2) rotate(8deg)}100%{opacity:0;transform:scale(1.8) rotate(20deg)}}
    @keyframes chestEmoji{0%{opacity:0;transform:translateY(20px) scale(.3) rotate(-20deg)}65%{opacity:1;transform:translateY(-7px) scale(1.25) rotate(8deg)}100%{transform:translateY(0) scale(1)}}

/* GR_40_NOUVEAUTES_PATCH — fonctionnalités additionnelles isolées */
(function(){
  S.grx = S.grx || {};
  const X = S.grx;
  Object.assign(X,{
    title:X.title||'Novice',
    nameColor:X.nameColor||'#b6ff5c',
    theme:X.theme||'classic',
    highContrast:!!X.highContrast,
    reduceMotion:!!X.reduceMotion,
    touchSize:X.touchSize||1,
    mutators:Array.isArray(X.mutators)?X.mutators:[],
    records:X.records||{survival:0,kills:0,score:0},
    history:Array.isArray(X.history)?X.history:[],
    achievements:Array.isArray(X.achievements)?X.achievements:[],
    secret:Array.isArray(X.secret)?X.secret:[],
    dailyClaim:X.dailyClaim||'',
    dailyProgress:X.dailyProgress||0,
    dailyDone:!!X.dailyDone,
    matchCount:X.matchCount||0,
    replay:Array.isArray(X.replay)?X.replay:[]
  });
  const dailyDefs=[
    {name:'Course légère',desc:'Déplacements plus rapides pendant le défi.',id:'light'},
    {name:'Tirs rapides',desc:'Les tirs partent plus vite.',id:'rapid'},
    {name:'Brouillard',desc:'La visibilité est réduite autour de ton slime.',id:'fog'},
    {name:'Collecte bonus',desc:'Des gelées bonus apparaissent pendant la partie.',id:'bonus'}
  ];
  const dayIndex=()=>Math.floor(Date.now()/86400000)%dailyDefs.length;
  const daily=()=>dailyDefs[dayIndex()];
  const mutDefs=[
    ['light','🪶','Gravité légère'],['rapid','⚡','Tirs accélérés'],
    ['fog','🌫️','Brouillard'],['bonus','🍬','Pluie de gelées'],
    ['tough','💪','Adversaires coriaces'],['noSuper','⭐','Sans Super']
  ];
  const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const stamp=()=>new Date().toLocaleDateString('fr-CA');
  const unlocked=()=>new Set([...S.own.map(i=>'slime:'+i),...(S.so||[]).map(i=>'skin:'+i)]);
  const achDefs=[
    ['first','🏆','Première victoire',()=>S.st.wins>=1,80],
    ['wins5','👑','Cinq victoires',()=>S.st.wins>=5,150],
    ['kills10','💥','Dix éliminations',()=>S.st.kills>=10,100],
    ['games10','🎮','Dix parties',()=>S.st.games>=10,100],
    ['top3','🥉','Sur le podium',()=>S.st.top3>=1,80],
    ['secret1','🕵️','Petit secret',()=>S.st.kills>=25&&S.st.wins>=3,180]
  ];
  function unlockAchievements(){
    let gained=[];
    achDefs.forEach(a=>{
      const secret=a[0]==='secret1';
      if(a[3]()&&!X.achievements.includes(a[0])){
        X.achievements.push(a[0]); if(secret)X.secret.push(a[0]);
        S.coins+=a[4]; gained.push(a[2]+' (+'+a[4]+' 🍬)');
      }
    });
    return gained;
  }
  function progressDaily(){
    if(X.dailyClaim!==stamp()){X.dailyClaim=stamp();X.dailyProgress=0;X.dailyDone=false}
    X.dailyProgress++;
    if(X.dailyProgress>=1&&!X.dailyDone){X.dailyDone=true;S.coins+=50;S.pp+=5}
  }
  function panel(){
    const d=daily(), owns=unlocked();
    const mut=mutDefs.map(m=>`<button class="${X.mutators.includes(m[0])?'sel':'alt'}" data-a="grmut" data-id="${m[0]}">${m[1]} ${m[2]}</button>`).join('');
    return `<h3>✨ Centre des nouveautés</h3>
      <p class="sm">40 idées regroupées dans des fonctions compatibles avec cette version du jeu.</p>
      <div class="list" style="width:min(560px,100%)">
        <div class="card" style="display:block"><b>🌞 Défi quotidien</b><p>${d.name} — ${d.desc}</p><p class="sm">Une règle spéciale change chaque jour. Progression : ${X.dailyDone?'terminée':'à jouer'}</p>${btn('grdaily','Lancer le défi quotidien','pulse')}</div>
        <div class="card" style="display:block"><b>🎛️ Mutateurs de partie</b><p class="sm">Choisis jusqu’à deux effets pour tes prochaines parties personnalisées.</p><div class="row">${mut}</div><p class="sm">${X.mutators.length}/2 sélectionnés</p></div>
        <div class="card" style="display:block"><b>🏅 Succès et secrets</b>${achDefs.map(a=>`<p class="sm">${X.achievements.includes(a[0])?'✅':'🔒'} ${a[1]} ${a[2]} ${a[0]==='secret1'&&!X.secret.includes(a[0])?' — ???':''}</p>`).join('')}</div>
        <div class="card" style="display:block"><b>📊 Records personnels</b><p>Meilleure survie : ${X.records.survival}s</p><p>Meilleures éliminations en une partie : ${X.records.kills}</p><p>Meilleur score : ${X.records.score}</p><p>Parties enregistrées : ${X.history.length}</p></div>

  };

  fire=function(s){
    if(g&&g.grxMods&&g.grxMods.includes('rapid')){
      const b=B[s.bi],v=b.rt;b.rt*=.72;try{return oldFire(s)}finally{b.rt=v}
    }
    return oldFire(s)
  };
  const oldUpdate=update;
  update=function(dt){
    if(g&&mode==='play'){
      g.grxEventTimer-=dt;
      if(g.grxEventTimer<=0){
        g.grxEventTimer=38;g.grxEventActive=7;
        const events=['🍬 Pluie de gelées !','🌫️ Brouillard temporaire !','⭐ Zone bonus activée !'];
        g.grxEventText=events[Math.floor(Math.random()*events.length)];
        if(g.grxEventText.includes('Pluie'))for(let i=0;i<8;i++){const a=rnd(0,6.28),r=rnd(80,430);g.gm.push({x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,ph:rnd(0,6)})}
      }
      g.grxEventActive=Math.max(0,g.grxEventActive-dt);
      // Objets bonus : soin, bouclier et accélération.
      if(!g.grxNextPickup)g.grxNextPickup=14;
      g.grxNextPickup-=dt;
      if(g.grxNextPickup<=0&&g.grxPickups.length<3){
        g.grxNextPickup=22;
        const a=rnd(0,6.28),r=rnd(80,480);
        g.grxPickups.push({x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,k:['heal','shield','speed'][Math.floor(Math.random()*3)],life:18});
      }
      for(let i=g.grxPickups.length-1;i>=0;i--){
        const q=g.grxPickups[i];q.life-=dt;
        if(q.life<=0){g.grxPickups.splice(i,1);continue}
        for(const p of g.P)if(p.al&&Math.hypot(p.x-q.x,p.y-q.y)<p.r+15){
          if(q.k==='heal')p.hp=Math.min(p.mh,p.hp+35);
          if(q.k==='shield')p.sh=Math.max(p.sh,35);
          if(q.k==='speed')p.hs=Math.max(p.hs||0,5);
          if(p.isP)sfx('gem');
          g.grxPickups.splice(i,1);break
        }
      }
      // Résumé de position périodique pour l'archive locale de parties.
      g.grxRecordTimer-=dt;
      if(g.grxRecordTimer<=0){
        g.grxRecordTimer=.75;
        const p=g.P[0];if(p)g.grxReplay.push([Math.round(g.t*2)/2,Math.round(p.x),Math.round(p.y),p.al?1:0]);
        if(g.grxReplay.length>260)g.grxReplay.shift()
      }
    }
    return oldUpdate(dt)
  };
  const oldDraw=draw;
  draw=function(now){
    oldDraw(now);
    if(!g||mode!=='play')return;
    const p=g.P[0];
    if(g.grxPickups?.length){
      const z=Math.min(W,H)/460,cam=p.al?p:(g.P.find(e=>e.al&&e.t===p.t)||p);
      ctx.save();ctx.textAlign='center';ctx.font='24px sans-serif';
      for(const q of g.grxPickups){
        const x=W/2+(q.x-cam.x)*z,y=H/2+(q.y-cam.y)*z;
        ctx.fillText(q.k==='heal'?'💚':q.k==='shield'?'🛡️':'⚡',x,y)
      }ctx.restore()
    }
    if(g.grxEventActive>0){
      ctx.save();ctx.fillStyle='rgba(6,25,31,.75)';ctx.fillRect(W/2-145,42,290,34);
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 16px Fredoka,sans-serif';ctx.fillText(g.grxEventText||'Événement !',W/2,65);ctx.restore()
    }
    if(g.grxMods?.includes('fog')||g.grxMods?.includes('fog')){
      const grad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.13,W/2,H/2,Math.min(W,H)*.55);
      grad.addColorStop(0,'rgba(4,20,30,0)');grad.addColorStop(1,'rgba(4,20,30,.86)');
      ctx.fillStyle=grad;ctx.fillRect(0,0,W,H)
    }
  };
  const oldFin=fin;
  fin=function(win,rank){
    if(g){
      const p=g.P[0],seconds=Math.round(g.t||0),kills=p?.k||0;
      X.records.survival=Math.max(X.records.survival,seconds);
      X.records.kills=Math.max(X.records.kills,kills);

      X.history.unshift({date:stamp(),mode:g.md||'solo',win:!!win,kills,seconds,slime:B[p?.bi||0]?.n||'Gloop'});
      X.history=X.history.slice(0,20);
      X.replay.unshift({date:stamp(),summary:(win?'Victoire':'Fin de partie')+' · '+kills+' éliminations',frames:g.grxReplay||[]});
      X.replay=X.replay.slice(0,5);
      progressDaily();
      const gained=unlockAchievements();
      if(gained.length)console.info('Succès débloqués :',gained.join(', '));
    }
    save();
    return oldFin(win,rank)
  };
  save();
})();

// Écran de chargement : ne doit jamais attendre les ressources réseau externes.
  (function(){

    };

    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(hideGrLoading,150),{once:true});

    // Filet de sécurité indépendant de l'événement window.load et des polices/images externes.
    setTimeout(hideGrLoading,2500);

  })();

      }).catch(e=>{console.error('Authentification Gelo Royal:',e);if(status)status.textContent='Impossible de se connecter : '+(e?.message||'erreur inconnue')});
      return;
    }
    if(a==='account_play')return;
    return priorAccountAct(a,d);
  };

  // Écran animé à chaque lancement de partie, y compris depuis un salon.
  const loadStyle=document.createElement('style');
  loadStyle.textContent=`#gr-match-loading{position:fixed;inset:0;z-index:1000001;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 38%,#205e58,#06191f 70%);color:#eafff3;text-align:center}#gr-match-loading.show{display:flex}#gr-match-loading .blob{width:78px;height:66px;border-radius:50% 50% 43% 43%;background:linear-gradient(145deg,#e2ff9c,#65d88a);box-shadow:inset -10px -9px 15px #174c3b66,0 0 28px #b6ff5c66;animation:grLoadHop .65s ease-in-out infinite alternate}#gr-match-loading h2{margin:0;color:#b6ff5c;font-size:clamp(2rem,8vw,3rem)}#gr-match-loading p{margin:0;color:#c7efe0}#gr-match-loading .bar{width:190px;height:8px;background:#ffffff25;overflow:hidden}#gr-match-loading .bar i{display:block;width:30%;height:100%;background:#b6ff5c;animation:grLoadProgress .8s ease-in-out infinite alternate}.pass-track{overscroll-behavior-x:contain;scrollbar-width:thin}.pass-track>.card.pass-special{border:2px solid #b6ff5c;background:linear-gradient(145deg,#214e54,#392c62)}.pass-reward{display:flex;align-items:center;gap:8px;min-height:48px;padding:7px;background:#092d2d;border-radius:10px;text-align:left}.pass-reward span{font-size:1.5rem}.pass-reward small{color:#d5f3e6}`;
  document.head.appendChild(loadStyle);
  const load=document.createElement('div');load.id='gr-match-loading';load.setAttribute('role','status');load.setAttribute('aria-live','polite');load.innerHTML='<div class="blob"></div><h2>Gelo Royal</h2><p>Préparation de la partie...</p><div class="bar"><i></i></div>';
  document.body.appendChild(load);
  const realStartGame=startGame;
  let matchLoading=false;
  startGame=function(){
    if(matchLoading)return;
    matchLoading=true;load.classList.add('show');
    setTimeout(()=>{
      try{realStartGame()}
      catch(e){console.error('Erreur au lancement de la partie:',e);grShowError('Impossible de lancer la partie : '+(e?.message||String(e)))}
      finally{setTimeout(()=>{load.classList.remove('show');matchLoading=false},350)}
    },850);
  };

  // === AMIS EN LIGNE : recherche par pseudo et demandes enregistrées dans Supabase ===
  const grFriendsState={results:[],incoming:[],outgoing:[],friends:[],status:'',search:''};
  async function grFriendsUser(){
    const {user}=await window.grOnlineAPI.prepareAccount();
    if(!user?.id)throw new Error('Connecte-toi avec ton pseudo et ton mot de passe avant d’utiliser la liste d’amis.');
    const client=window.grOnlineAPI.client;
    if(!client)throw new Error('Connexion Supabase indisponible. Réessaie dans quelques secondes.');
    const nickname=String(user.user_metadata?.nickname||S.nm||'Slime').trim().slice(0,14)||'Slime';
    const {error}=await client.from('gr_profiles').upsert({user_id:user.id,nickname,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error)throw new Error('Profil joueur : '+error.message+' (vérifie les tables et règles SQL des amis).');
    return {client,user,nickname};
  }
  const grFriendEsc=s=>esc(String(s||''));
  async function grFriendsLoad(){
    const {client,user}=await grFriendsUser(),id=user.id;
    const [incoming,outgoing,acceptedIn,acceptedOut]=await Promise.all([
      client.from('gr_friend_requests').select('id,requester_id,addressee_id,status,created_at').eq('addressee_id',id).eq('status','pending').order('created_at',{ascending:false}),
      client.from('gr_friend_requests').select('id,requester_id,addressee_id,status,created_at').eq('requester_id',id).eq('status','pending').order('created_at',{ascending:false}),
      client.from('gr_friend_requests').select('id,requester_id,addressee_id,status').eq('addressee_id',id).eq('status','accepted'),
      client.from('gr_friend_requests').select('id,requester_id,addressee_id,status').eq('requester_id',id).eq('status','accepted')
    ]);
    for(const r of [incoming,outgoing,acceptedIn,acceptedOut])if(r.error)throw r.error;
    grFriendsState.incoming=incoming.data||[];grFriendsState.outgoing=outgoing.data||[];
    const ids=[...grFriendsState.incoming.map(x=>x.requester_id),...grFriendsState.outgoing.map(x=>x.addressee_id),...(acceptedIn.data||[]).map(x=>x.requester_id),...(acceptedOut.data||[]).map(x=>x.addressee_id)];
    const unique=[...new Set(ids)];
    let profiles=[];
    if(unique.length){const pr=await client.from('gr_profiles').select('user_id,nickname').in('user_id',unique);if(pr.error)throw pr.error;profiles=pr.data||[];}
    const names=Object.fromEntries(profiles.map(x=>[x.user_id,x.nickname]));
    grFriendsState.incoming=grFriendsState.incoming.map(x=>({...x,nickname:names[x.requester_id]||'Joueur'}));
    grFriendsState.outgoing=grFriendsState.outgoing.map(x=>({...x,nickname:names[x.addressee_id]||'Joueur'}));
    grFriendsState.friends=[...(acceptedIn.data||[]).map(x=>({id:x.id,user_id:x.requester_id,nickname:names[x.requester_id]||'Joueur'})),...(acceptedOut.data||[]).map(x=>({id:x.id,user_id:x.addressee_id,nickname:names[x.addressee_id]||'Joueur'}))];
  }
  async function grFriendsSearch(){
    const term=String($('gr-friend-search')?.value||'').trim().replace(/[%,]/g,'').slice(0,14);
    grFriendsState.search=term;grFriendsState.status='Recherche…';go('friends');
    if(term.length<2){grFriendsState.status='Entre au moins 2 caractères de pseudo.';go('friends');return;}
    try{
      const {client,user}=await grFriendsUser();
      const {data,error}=await client.from('gr_profiles').select('user_id,nickname').ilike('nickname','%'+term+'%').neq('user_id',user.id).limit(12);
      if(error)throw error;
      grFriendsState.results=data||[];grFriendsState.status=grFriendsState.results.length?'Joueurs trouvés :':'Aucun joueur trouvé avec ce pseudo.';
    }catch(e){grFriendsState.status='Recherche impossible : '+(e.message||String(e));grFriendsState.results=[];}
    go('friends');
  }
  async function grFriendsAdd(id){
    try{
      const {client,user}=await grFriendsUser();
      if(!id||id===user.id)throw new Error('Tu ne peux pas t’ajouter toi-même.');
      const [a,b]=await Promise.all([
        client.from('gr_friend_requests').select('id,status').eq('requester_id',user.id).eq('addressee_id',id).maybeSingle(),
        client.from('gr_friend_requests').select('id,status').eq('requester_id',id).eq('addressee_id',user.id).maybeSingle()
      ]);
      if(a.error)throw a.error;if(b.error)throw b.error;
      if(a.data?.status==='accepted'||b.data?.status==='accepted')throw new Error('Vous êtes déjà amis.');
      if(a.data?.status==='pending')throw new Error('Demande déjà envoyée.');
      if(b.data?.status==='pending')throw new Error('Cette personne t’a déjà envoyé une demande : regarde les demandes reçues.');
      const {error}=await client.from('gr_friend_requests').insert({requester_id:user.id,addressee_id:id,status:'pending'});
      if(error)throw error;
      grFriendsState.status='Demande d’ami envoyée !';await grFriendsLoad();
    }catch(e){grFriendsState.status='Impossible d’envoyer la demande : '+(e.message||String(e));}
    go('friends');
  }
  async function grFriendsRespond(requestId,accept){
    try{
      const {client,user}=await grFriendsUser();
      const {error}=await client.from('gr_friend_requests').update({status:accept?'accepted':'declined',updated_at:new Date().toISOString()}).eq('id',requestId).eq('addressee_id',user.id).eq('status','pending');
      if(error)throw error;
      grFriendsState.status=accept?'Demande acceptée !':'Demande refusée.';await grFriendsLoad();
    }catch(e){grFriendsState.status='Action impossible : '+(e.message||String(e));}
    go('friends');
  }
  T.friends=()=>{
    const results=grFriendsState.results.map(p=>'<div class="row" style="justify-content:space-between"><b>🟢 '+grFriendEsc(p.nickname)+'</b>'+btn('gr_friend_add','Ajouter','alt','data-id='+p.user_id)+'</div>').join('');
    const incoming=grFriendsState.incoming.map(r=>'<div class="row" style="justify-content:space-between"><b>'+grFriendEsc(r.nickname)+'</b><span>'+btn('gr_friend_accept','Accepter','alt','data-id='+r.id)+' '+btn('gr_friend_decline','Refuser','alt','data-id='+r.id)+'</span></div>').join('');
    const outgoing=grFriendsState.outgoing.map(r=>'<p class="sm">'+grFriendEsc(r.nickname)+' · En attente</p>').join('');
    const friends=grFriendsState.friends.map(r=>'<p class="sm">🟢 '+grFriendEsc(r.nickname)+'</p>').join('');
    return `<div class="big">👥</div><h3>Mes amis</h3><p class="sm">Trouve tes amis avec leur pseudo et envoie-leur une demande.</p>
      <div class="card" style="width:min(460px,100%);display:block"><b>🔎 Ajouter un ami</b><div class="row"><input id="gr-friend-search" maxlength="14" placeholder="Pseudo du joueur" value="${grFriendEsc(grFriendsState.search)}" style="flex:1;min-width:150px">${btn('gr_friend_search','Rechercher')}</div><p class="sm">${grFriendEsc(grFriendsState.status)}</p>${results||''}</div>
      <div class="card" style="width:min(460px,100%);display:block"><b>📨 Demandes reçues (${grFriendsState.incoming.length})</b>${incoming||'<p class="sm">Aucune demande reçue.</p>'}</div>
      <div class="card" style="width:min(460px,100%);display:block"><b>⏳ Demandes envoyées (${grFriendsState.outgoing.length})</b>${outgoing||'<p class="sm">Aucune demande en attente.</p>'}</div>
      <div class="card" style="width:min(460px,100%);display:block"><b>💚 Mes amis (${grFriendsState.friends.length})</b>${friends||'<p class="sm">Tu n’as pas encore d’amis. Recherche un pseudo pour commencer !</p>'}</div>
      <div class="row">${btn('gr_friend_refresh','🔄 Actualiser','alt')}${btn('home','Retour','alt')}</div>`;
  };
  const grFriendsOldHome=T.home;
  T.home=()=>grFriendsOldHome(); // Conserve tous les anciens boutons du menu d’accueil.
  const grFriendsOldAct=act;
  act=function(a,d){
    if(a==='gr_friend_search'){grFriendsSearch();return}
    if(a==='gr_friend_add'){grFriendsAdd(d.id);return}
    if(a==='gr_friend_accept'){grFriendsRespond(d.id,true);return}
    if(a==='gr_friend_decline'){grFriendsRespond(d.id,false);return}
    if(a==='gr_friend_refresh'){grFriendsState.status='Actualisation…';grFriendsLoad().then(()=>{grFriendsState.status='Liste actualisée.';go('friends')}).catch(e=>{grFriendsState.status='Erreur : '+(e.message||String(e));go('friends')});return}
    if(a==='friends'){grFriendsState.status='Chargement des amis…';go('friends');grFriendsLoad().then(()=>{grFriendsState.status='';go('friends')}).catch(e=>{grFriendsState.status='Erreur : '+(e.message||String(e));go('friends')});return}
    return grFriendsOldAct(a,d);
  };

  // Toujours vérifier la session Supabase avant d'ouvrir le jeu.
  go('welcome');
  if(window.grOnlineAPI?.prepareAccount){
    window.grOnlineAPI.prepareAccount().then(async({user})=>{
      if(!user)return;
      S.nm=String(user.user_metadata?.nickname||S.nm||'Slime').slice(0,14);
      S.authEmail='';
      S.authOk=true;S.accountOk=true;
      try{await window.grOnlineAPI.activateAccount(user)}catch(syncError){console.error('Cloud save:',syncError);}
      save();go('home');
    }).catch(e=>{
      console.error('Restauration du compte Gelo Royal:',e);
      const status=$('account-status');
      if(status)status.textContent='Impossible de vérifier la connexion : '+(e?.message||'erreur inconnue')+'. Tu peux essayer « J’ai déjà un compte ».';
    });
  }
  save();
})();



/* === Saison 1, rangs compétitifs (aperçu honnête), coffres et émotes boutique === */
(function(){
  // Identité de saison : les anciennes progressions et récompenses sont conservées.
  S.season=S.season||{premium:false,claimedFree:[],claimedPremium:[]};
  S.season.claimedFree=Array.isArray(S.season.claimedFree)?S.season.claimedFree:[];
  S.season.claimedPremium=Array.isArray(S.season.claimedPremium)?S.season.claimedPremium:[];
  S.rank=S.rank&&typeof S.rank==='object'?S.rank:{points:0,season:1};
  S.rank.points=Math.max(0,Number(S.rank.points)||0);
  S.rank.season=1;

  // Six émotes-signatures de Gelo Royal (compositions originales d'emojis).
  const originalEmotes=['🫧👑','🍮✨','🐝💨','🧊😵','🍬💥','🌈🕺'];
  originalEmotes.forEach(e=>{if(!EM.includes(e))EM.push(e)});
  const emotePrices={14:120,15:150,16:180,17:180,18:220,19:250};

  // Renomme la piste existante sans casser ses récompenses ni sa progression.
  const seasonBase=T.season;
  T.season=function(){
    let html=seasonBase();
    html=html.replace('<h3>Passe de saison</h3>','<h3>🎟️ Saison 1 — Le réveil des gelées</h3><p class="hl">Saison actuelle · Récompenses gratuites et premium</p>');
    html=html.replace('Progression : ${xp} XP · Niveau ${level}/10','Progression : ${xp} XP · Niveau ${level}/10');
    html=html.replace('Option payante non activée. Aucun paiement n’est possible dans cette version.','Option en préparation. Les achats en argent réel ne sont pas activés.');
    return html;
  };

  // Le vrai mode classé reste fermé tant que les combats en ligne ne sont pas synchronisés.
  // On affiche les rangs prévus, sans inventer de classement mondial ni de points gagnés.
  const rankTiers=[
    {name:'Bronze',icon:'🪨',min:0,next:100},
    {name:'Argent',icon:'🥈',min:100,next:250},
    {name:'Or',icon:'🥇',min:250,next:450},
    {name:'Diamant',icon:'💎',min:450,next:700},
    {name:'Maître',icon:'👑',min:700,next:1000},
    {name:'Légende',icon:'🌟',min:1000,next:null}
  ];
  T.ranked=function(){
    const points=S.rank.points||0;
    const current=rankTiers.slice().reverse().find(r=>points>=r.min)||rankTiers[0];
    const next=rankTiers.find(r=>r.min===current.next);
    const progress=next?Math.max(0,Math.min(100,(points-current.min)/(next.min-current.min)*100)):100;
    return `<div class="big">🏆</div><h3>Mode classé</h3>
      <div class="card" style="width:min(460px,100%);display:block;text-align:center">
        <div style="font-size:3rem">${current.icon}</div><h2>${current.name}</h2>
        <p class="sm">Saison 1 · Pré-saison</p><b>${points} points de classement</b>
        <div class="bar"><i style="width:${progress}%"></i></div>
        <small>${next?Math.max(0,next.min-points)+' points avant '+next.name:'Rang maximal atteint'}</small>
      </div>
      <h4>Les rangs de Gelo Royal</h4>
      <div class="list">${rankTiers.map(r=>`<div class="card"><span style="font-size:1.8rem">${r.icon}</span><div><b>${r.name}</b><br><small>${r.min}${r.next?' à '+r.next+' points':' points et plus'}</small></div>${points>=r.min?'<span class="ok">Atteint</span>':'<span class="sm">🔒</span>'}</div>`).join('')}</div>
      <div class="card" style="width:min(460px,100%);display:block"><b>🌐 Matchs classés en ligne</b><p class="sm">Le matchmaking classé sera activé quand les combats, tirs, dégâts et résultats seront réellement synchronisés entre les joueurs. Pour l'instant, aucun faux match ni faux classement mondial n'est affiché.</p><button class="alt off" disabled>Matchmaking classé — bientôt</button></div>
      ${btn('ranking','Voir mes statistiques','alt')}${btn('home','Retour','alt')}`;
  };

  // Boutique : achats avec bonbons gagnés en jouant. Les coffres aléatoires ne sont
  // pas vendus contre de l'argent réel ; les achats réels éventuels seront directs et cosmétiques.
  const shopBase=T.shop;
  T.shop=function(){
    const base=shopBase();
    const chestHtml=`<h4>🌟 Coffre doré</h4><p class="sm">Les coffres bois, cristal et royal sont déjà disponibles plus haut dans la boutique.</p><div class="card"><span style="font-size:1.7rem">🌟</span><div><b>Coffre doré</b><br><small>En stock : ${S.cg||0} · 300 🍬</small></div>${btn('gr_buy_chest','🍬 300',S.coins>=300?'':'alt off','data-k=gold')}</div>`;
    const emotes=originalEmotes.map(e=>EM.indexOf(e)).filter(i=>i>=0);
    const emoteHtml=`<h4>😀 Émotes originales</h4><p class="sm">Des expressions créées pour l'univers de Gelo Royal.</p>${emotes.map(i=>`<div class="card"><span style="font-size:1.8rem">${EM[i]}</span><div><b>Émote Gelo Royal</b><br><small>Cosmétique · aucun avantage en combat</small></div>${S.em.includes(i)?'<span class="ok">Obtenue</span>':btn('gr_buy_emote','🍬 '+emotePrices[i],S.coins>=emotePrices[i]?'':'alt off','data-i='+i)}</div>`).join('')}`;
    const cashHtml=`<h4>💳 Offres en argent réel</h4><div class="card" style="display:block"><b>Cosmétiques uniquement</b><p class="sm">Les paiements ne sont pas activés dans cette version. Plus tard, seuls des objets cosmétiques précis pourront être achetés directement, avec un paiement sécurisé configuré par un parent ou tuteur. Pas de paiement pour des coffres aléatoires, de puissance ou d'avantage classé.</p><button class="alt off" disabled>Achats réels — bientôt</button></div>`;
    return base.replace(/<button[^>]*data-a="home"[^>]*>Retour<\/button>\s*$/,'')+chestHtml+emoteHtml+cashHtml+btn('home','Retour','alt');
  };

  const previousHome=T.home;
  T.home=function(){
    return previousHome().replace(/data-a="ranking"/g,'data-a="ranked"').replace('🏆 Classement','🏆 Mode classé');
  };

  const previousAct=act;
  act=function(a,d){
    if(a==='ranked'){go('ranked');return}
    if(a==='gr_buy_chest'){
      const prices={wood:120,gold:300,crystal:350,royal:900};
      const k=d.k,cost=prices[k];
      if(cost&&S.coins>=cost){
        S.coins-=cost;
        if(k==='wood')S.ch=(S.ch||0)+1;
        else if(k==='gold')S.cg=(S.cg||0)+1;
        else {S.cu.chests=S.cu.chests||{crystal:0,royal:0};S.cu.chests[k]=(S.cu.chests[k]||0)+1;}
        save();coins(1);sfx('ok');
      }
      go('shop');return;
    }
    if(a==='gr_buy_emote'){
      const i=Number(d.i),cost=emotePrices[i];
      if(Number.isInteger(i)&&cost&&EM[i]&&!S.em.includes(i)&&S.coins>=cost){
        S.coins-=cost;S.em.push(i);save();coins(1);sfx('ok');
      }
      go('shop');return;
    }
    return previousAct(a,d);
  };

  // Le bouton de classement dans le dock latéral ouvre maintenant la page de rangs.
  save();
})();

/* GR_NEWS_ADMIN_CODE_V2 — publications publiques protégées par code serveur Supabase */
(function(){
  const NS={items:[],status:'Chargement des nouveautés…'};
  const escNews=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const newsClient=()=>window.grOnlineAPI?.client||null;
  async function newsLoad(){
    NS.status='Chargement des nouveautés…';
    try{
      const c=newsClient(); if(!c)throw new Error('Connexion au serveur en cours. Réessaie dans quelques secondes.');
      const {data,error}=await c.from('gr_public_news').select('id,title,body,image_data,created_at').order('created_at',{ascending:false}).limit(40);
      if(error)throw error; NS.items=data||[];NS.status='';
    }catch(e){NS.status='Impossible de charger les nouveautés : '+(e.message||String(e));NS.items=[];}
  }
  function newsCards(){
    if(NS.status)return `<p class="sm">${escNews(NS.status)}</p>`;
    if(!NS.items.length)return '<p class="sm">Aucune nouveauté publiée pour le moment.</p>';
    return NS.items.map(n=>`<article class="card" style="display:block;text-align:left;width:min(560px,100%);margin:10px auto"><h4>${escNews(n.title)}</h4>${n.image_data?`<img src="${escNews(n.image_data)}" alt="Image de la nouveauté" loading="lazy" style="display:block;max-width:100%;max-height:280px;object-fit:contain;border-radius:12px;margin:8px auto">`:''}<p style="white-space:pre-wrap">${escNews(n.body)}</p><p class="sm">${n.created_at?new Date(n.created_at).toLocaleString('fr-CA'):''}</p></article>`).join('');
  }
  const baseNewsPanel=T.grx;
  T.grx=function(){
    const html=baseNewsPanel();
    const feed=`<section class="card" style="display:block;width:min(600px,100%);margin:10px auto;text-align:left"><h3>📢 Annonces officielles</h3>${newsCards()}<div class="row">${btn('gr_news_refresh','🔄 Actualiser','alt')}${btn('gr_news_admin','🔐 Admin','alt')}</div></section>`;
    return html.replace('<h3>✨ Centre des nouveautés</h3>','<h3>✨ Centre des nouveautés</h3>'+feed);
  };
  T.gr_news_admin=()=>`<h3>🔐 Administration des nouveautés</h3><p class="sm">Entre le code secret réservé à l'administration. Il sera vérifié par Supabase et ne sera pas sauvegardé dans le jeu.</p><div class="card" style="display:block;width:min(560px,100%);margin:auto;text-align:left"><label for="gr-news-code">Code administrateur</label><input id="gr-news-code" type="password" maxlength="100" autocomplete="off" placeholder="Code secret"><label for="gr-news-title">Titre</label><input id="gr-news-title" maxlength="70" placeholder="Ex. Nouvelle saison !"><label for="gr-news-body">Message</label><textarea id="gr-news-body" maxlength="1800" rows="6" placeholder="Écris les nouveautés ici…"></textarea><label for="gr-news-image">Image (facultative, PNG/JPG/WEBP, 2 Mo maximum)</label><input id="gr-news-image" type="file" accept="image/png,image/jpeg,image/webp"><p id="gr-news-admin-status" class="sm"></p><div class="row">${btn('gr_news_publish','📢 Publier','pulse')}${btn('grx','Retour','alt')}</div></div>${btn('home','Accueil','alt')}`;
  function fileAsDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('Impossible de lire cette image.'));r.readAsDataURL(file);});}
  async function compressNewsImage(file){
    if(!file)return null;
    if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>2*1024*1024)throw new Error('Choisis une image PNG, JPG ou WEBP de 2 Mo maximum.');
    const source=await fileAsDataURL(file);
    const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Image illisible.'));im.src=source;});

/* === GELÉE ROYALE : PARTIE EN LIGNE SYNCHRONISÉE === */
(function(){
  const bridge=window.GRNetBridge;

      .then(status=>{if(status!=='ok'&&Date.now()-lastSendWarn>3000){lastSendWarn=Date.now();netStatus('Réseau instable : certains événements n’ont pas été envoyés.')}})

  window.GRNetControl={
    sendInput(x,y,fire,aim,manual){send({kind:'input',x,y,fire:!!fire,aim:Number(aim)||0,manual:!!manual})},
    sendEmote(index,dance){send({kind:'emote',index:Number(index),dance:String(dance||'').slice(0,32)})},
    leave(){if(netActive&&!netHost)send({kind:'leave'});netActive=false;netSlot=-1;netGameId='';bridge.setGameId('')},
    isClient(){return netActive&&!netHost},
    isFresh(){return !netActive||netHost||Date.now()-lastAuthoritativeState<4500},
    status:netStatus
  };
  function hostId(){
    // La présence du salon principal sert à élire le premier joueur connecté.
    const state=bridge.presenceState;
    if(state){const rows=[];for(const [id,metas] of Object.entries(state)){const m=Array.isArray(metas)?metas[0]:metas;rows.push({id,at:m?.joined_at||''})}rows.sort((a,b)=>(a.at||'').localeCompare(b.at||'')||a.id.localeCompare(b.id));if(rows.length)return rows[0].id}
    return bridge.myId;
  }
  function serialize(){
    if(!g)return null;
    const state={...g,pt:[],fd:(g.fd||[]).slice(-3),dmg:(g.dmg||[]).slice(-12),em:(g.em||[]).slice(-12)};
    return JSON.stringify(state,function(k,v){
      if(k==='P'&&this===state)return v;
      if(Array.isArray(this)&&this===state.P)return v;
      const i=state.P.indexOf(v);
      if(i>=0)return {__grPlayerIndex:i};
      if(v instanceof Set)return [];
      return v;
    });
  }
  function apply(raw){
    try{
      const next=JSON.parse(raw);
      if(!next||!Array.isArray(next.P))return;
      const revive=(v,seen=new Set())=>{if(!v||typeof v!=='object'||seen.has(v))return v;if(Number.isInteger(v.__grPlayerIndex))return next.P[v.__grPlayerIndex]||next.P[0];seen.add(v);for(const k of Object.keys(v))v[k]=revive(v[k],seen);return v};
      revive(next);
      if(!netHost){
        const own=next.P.find(p=>p.i===netSlot);
        if(!own)return;
        next.P=[own,...next.P.filter(p=>p!==own)];
        next.P.forEach(p=>p.isP=false);own.isP=true;own.netOwner=bridge.myId;own.nm=(S.nm||'Toi').slice(0,14);
      }
      applying=true;g=next;mode='play';if(ui)ui.className='scr';const pauseButton=$('pz');if(pauseButton)pauseButton.style.display='block';
    }catch(e){console.warn('État réseau invalide:',e)}finally{applying=false}
  }
  function assign(id,nickname){
    if(!netHost||!g||mode!=='play')return;
    let p=g.P.find(x=>x.netOwner===id)||g.P.find((x,i)=>i>0&&!x.netOwner);
    if(!p){send({kind:'full',to:id});return}
    p.netOwner=id;p.nm=String(nickname||'Joueur').slice(0,14);p.isP=false;p.mx=0;p.my=0;p.netLastInput=Date.now();
    send({kind:'assign',to:id,slot:p.i,md:g.md});send({kind:'state',to:id,md:g.md,state:serialize()});
  }
  function message(p){
    if(!p||p.room!==bridge.room||p.from===bridge.myId)return;
    if(p.kind==='start'&&!netHost){
      netActive=true;netSlot=-1;netGameId=p.game_id||'';lastAuthoritativeState=Date.now();S.m=p.md;bridge.setGameId('');
      startGame();send({kind:'hello',nickname:(S.nm||'Slime').slice(0,14),bi:S.sel,skin:S.sk[S.sel]||0});return;
    }
    if(p.game_id&&netGameId&&p.game_id!==netGameId)return;
    if(p.kind==='hello'&&netHost&&mode==='play'){assign(p.from,p.nickname);const slot=g?.P?.find(x=>x.netOwner===p.from);if(slot&&Number.isInteger(+p.bi)&&+p.bi>=0&&+p.bi<B.length){slot.bi=+p.bi;slot.mh=B[slot.bi].hp;slot.hp=slot.mh;slot.sk=Math.max(0,Math.min(100,+p.skin||0));send({kind:'state',to:p.from,md:g.md,state:serialize()})}return}
    if(p.kind==='assign'&&p.to===bridge.myId&&!netHost){netSlot=p.slot;netActive=true;return}
    if(p.kind==='full'&&p.to===bridge.myId){netStatus('La partie est complète. Réessaie dans un autre salon.');return}
    if(p.kind==='input'&&netHost&&g&&mode==='play'){
      const s=g.P.find(x=>x.netOwner===p.from);
      if(s){s.mx=Math.max(-1,Math.min(1,+p.x||0));s.my=Math.max(-1,Math.min(1,+p.y||0));s.netLastInput=Date.now()}
      return;
    }
    if(p.kind==='super'&&netHost&&g&&mode==='play'){
      const s=g.P.find(x=>x.netOwner===p.from);if(s&&s.al){const old=doSuper;applying=true;try{old(s)}finally{applying=false}}return;
    }
    if(p.kind==='state'&&!netHost&&(!p.to||p.to===bridge.myId)){
      if(p.state&&netSlot>=0){netActive=true;apply(p.state)}return;
    }
    if(p.kind==='cancel'&&!netHost){netActive=false;netSlot=-1;netGameId='';g=null;mode='home';go('online');netStatus('L’hôte a quitté la partie.');return}
    if(p.kind==='end'&&!netHost&&g&&mode==='play'){
      if(p.state)apply(p.state);
      const own=g.P[0],alive=g.P.filter(x=>x.al).length;
      let win=false,rank=own.netRank|| (own.al?1:Math.max(2,alive+1));
      if(g.tm||g.md==='duo'||g.md==='conquest'){const winner=Number.isInteger(p.winner_team)?p.winner_team:(p.host_win?0:1);win=own.t===winner;rank=win?1:2}
      else win=!!own.al;
      applying=true;try{fin(win,rank)}finally{applying=false}return;
    }
  }
  async function openChannel(){
    if(!bridge.client||!bridge.room)return false;
    if(channel&&netRoom===bridge.room&&channelReady)return true;
    if(channel){try{await bridge.client.removeChannel(channel)}catch(e){}channel=null;channelReady=false}
    netRoom=bridge.room;channel=bridge.client.channel('gr-game-'+netRoom,{config:{broadcast:{self:false}}});
    channel.on('broadcast',{event:'gr_net'},({payload})=>message(payload));
    const ok=await new Promise(resolve=>{let done=false;const finish=v=>{if(!done){done=true;clearTimeout(timer);resolve(v)}};const timer=setTimeout(()=>finish(false),10000);channel.subscribe(status=>{if(status==='SUBSCRIBED'){channelReady=true;finish(true)}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')finish(false)})});

  }
  const oldAI=ai;
  ai=function(s){if(netHost&&s.netOwner){if(Date.now()-(s.netLastInput||0)>1200){s.mx=0;s.my=0}return}return oldAI(s)};
  const oldUpdate=update;
  update=function(dt){
    if(netActive&&!netHost){
      if(g&&mode==='play'&&netSlot>=0){input(g.P[0]);const now=Date.now();if(now-lastInput>INPUT_TICK){lastInput=now;send({kind:'input',x:g.P[0].mx,y:g.P[0].my})}}
      return;
    }
    oldUpdate(dt);
    if(netHost&&netActive&&g&&mode==='play'&&Date.now()-lastState>NET_TICK){lastState=Date.now();send({kind:'state',md:g.md,state:serialize()})}
  };
  // Les tirs manuels des clients sont exécutés par l'hôte avec leur visée réelle.
  const oldFireForNet=fire;
  fire=function(s){
    if(netHost&&netActive&&s&&s.netOwner&&s.netManual){
      if(!s.netFire)return;
      const wasP=s.isP,wasMan=S.o.man,wasF=inp.f,wasA=inp.a;
      s.isP=true;S.o.man=1;inp.f=1;inp.a=Number(s.netAim)||0;
      try{return oldFireForNet(s)}finally{s.isP=wasP;S.o.man=wasMan;inp.f=wasF;inp.a=wasA}
    }
    return oldFireForNet(s);
  };
  const oldSuper=doSuper;
  doSuper=function(s){if(netActive&&!netHost&&!applying){send({kind:'super'});return}return oldSuper(s)};
  const oldDie=die;
  die=function(s,o){if(netHost&&netActive&&s&&!g.tm)s.netRank=g.P.filter(x=>x.al).length;return oldDie(s,o)};
  const oldFin=fin;

    if(netHost&&netActive&&!applying){let winnerTeam=null;if(g?.tm)winnerTeam=win?0:1;else if(g?.md==='duo')winnerTeam=g.P.find(x=>x.al)?.t??(win?0:1);else if(g?.md==='conquest')winnerTeam=g.conquestWinner??(win?0:1);send({kind:'end',host_win:!!win,winner_team:winnerTeam,rank:rank||1,state:serialize()})}

  act=function(a,d){

/* Correctif Battle Royale en ligne : une seule élimination finale, aucun respawn. */
(function(){
  const bridge=window.GRNetBridge;
  if(!bridge||window.GR_BR_SOLO_FINALITY_V1)return;
  window.GR_BR_SOLO_FINALITY_V1=true;
  const previousFin=fin;
  fin=function(win,rank){
    // En Royale solo, la mort de l'hôte ne termine pas la partie tant qu'il reste
    // au moins deux survivants : le serveur-hôte continue à simuler le match.
    if(bridge.myId&&window.GROnlineDiagnostics){
      const net=window.GROnlineDiagnostics();
      if(net.active&&net.host&&g&&g.md==='solo'&&mode==='play'&&!applying){
        const alive=g.P.filter(p=>p.al).length;
        if(alive>1)return;
        const survivor=g.P.find(p=>p.al);
        win=!!survivor&&survivor.netOwner===bridge.myId;
        rank=win?1:Math.max(2,g.P.filter(p=>p.al).length+1);
      }
    }
    return previousFin(win,rank);
  };
})();



/* === GELÉE ROYALE : PACK DE 20 NOUVEAUTÉS === */
(function(){
  if(window.GR_FEATURE_PACK_20)return;
  window.GR_FEATURE_PACK_20=true;
  const oldStart=startGame, oldUpdate=update, oldDraw=draw, oldHurt=hurt, oldDie=die, oldMove=move, oldFire=fire, oldFin=fin;
  const TYPES={
    heal:{icon:'💚',name:'Soin',color:'#7dff9a'},
    shield:{icon:'🛡️',name:'Bouclier',color:'#65dcff'},
    speed:{icon:'⚡',name:'Vitesse',color:'#ffe66b'},
    rage:{icon:'🔥',name:'Puissance',color:'#ff9a55'},
    magnet:{icon:'🧲',name:'Aimant',color:'#c99bff'},
    crate:{icon:'🎁',name:'Caisse bonus',color:'#ffd36b'}
  };
  let hitFlash=0,lowPulse=0,streakBanner=0,streakText='',confetti=[],eventBanner=0,eventText='';
  function announce(txt,color){
    if(!g)return;
    g.fd=g.fd||[];
    g.fd.unshift({t:2.5,x:txt,c:color||'#ffe66b'});
    g.fd=g.fd.slice(0,5);
  }
  function spawnBonus(){
    if(!g||!g.bonus) return;
    const keys=Object.keys(TYPES),type=keys[Math.floor(Math.random()*keys.length)];
    const a=rnd(0,6.283),d=rnd(100,570);
    g.bonus.push({x:CX+Math.cos(a)*d,y:CY+Math.sin(a)*d,type,t:18,ph:rnd(0,6)});
    if(g.bonus.length>7)g.bonus.shift();
  }
  startGame=function(){
    oldStart();
    if(!g)return;
    g.bonus=[];g.bonusClock=7;g.eventClock=42;g.eventNo=0;
    g.matchStats={pickups:0,damage:0,assists:0};
    for(const p of g.P){p.streak=0;p.buffs={speed:0,rage:0,magnet:0};}
    hitFlash=0;lowPulse=0;streakBanner=0;confetti=[];eventBanner=0;
  };
  move=function(p,dt){
    const base= B[p.bi]?.sv||120;
    const before=base;
    oldMove(p,dt);
    if(p.buffs?.speed>0&&p.al){
      const m=Math.hypot(p.mx||0,p.my||0);
      if(m>.02){
        const extra=base*.48*dt;
        p.x+=(p.mx/m)*extra;p.y+=(p.my/m)*extra;
      }
    }
  };
  fire=function(p){
    const before=g?.bl?.length||0;
    oldFire(p);
    if(p.buffs?.rage>0&&p.al&&g&&g.bl.length>before){
      for(let i=before;i<g.bl.length;i++)g.bl[i].d*=1.35;
    }
  };
  hurt=function(p,d,attacker){
    const hp=p?.hp||0,sh=p?.sh||0;
    oldHurt(p,d,attacker);
    if(g){
      const actual=Math.max(0,(hp-(p?.hp||0))+(sh-(p?.sh||0)));
      if(actual>0){
        g.dmg=g.dmg||[];
        g.dmg.push({x:p.x,y:p.y-22,t:.85,v:Math.round(actual),c:'#fff0a6'});
        if(attacker?.isP){g.matchStats=g.matchStats||{damage:0};g.matchStats.damage+=actual;}
        if(p.isP){hitFlash=.24;if(p.hp/p.mh<.28)lowPulse=.5;}
      }
    }
  };
  die=function(p,attacker){
    const wasAlive=!!p?.al;
    oldDie(p,attacker);
    if(wasAlive&&attacker&&attacker!==p){
      attacker.streak=(attacker.streak||0)+1;attacker.streakTimer=10;
      if(attacker.streak>=3){
        const n=attacker.streak;
        attacker.hp=Math.min(attacker.mh,attacker.hp+18);
        attacker.sup=Math.min(1,(attacker.sup||0)+.18);
        streakText='🔥 '+n+' ÉLIMINATIONS À LA SUITE !';
        streakBanner=2.2;
        announce(streakText,'#ffe66b');
        if(attacker.isP)sfx('sup');
      }
    }
    if(wasAlive&&p?.isP&&g){p.streak=0;}
  };
  fin=function(win,rank){
    const before=mode;
    oldFin(win,rank);
    if(win){
      confetti=Array.from({length:85},()=>({x:rnd(0,W),y:rnd(-H,0),vx:rnd(-45,45),vy:rnd(65,190),r:rnd(2,5),t:rnd(2,4),c:['#b6ff5c','#ff5fa8','#5ec8ff','#ffd24a','#fff'][Math.floor(Math.random()*5)]}));
    }
  };
  update=function(dt){
    oldUpdate(dt);
    if(mode!=='play'||!g)return;
    hitFlash=Math.max(0,hitFlash-dt);lowPulse=Math.max(0,lowPulse-dt);
    streakBanner=Math.max(0,streakBanner-dt);eventBanner=Math.max(0,eventBanner-dt);
    g.bonus=g.bonus||[];
    g.bonusClock=(g.bonusClock??7)-dt;
    if(g.bonusClock<=0){spawnBonus();g.bonusClock=11+rnd(0,5);}
    for(let i=g.bonus.length-1;i>=0;i--){
      const b=g.bonus[i];b.t-=dt;b.ph+=dt*3;
      if(b.t<=0){g.bonus.splice(i,1);continue;}
      for(const p of g.P){
        if(!p.al)continue;
        if(p.buffs?.magnet>0){
          const d=Math.hypot(p.x-b.x,p.y-b.y);
          if(d<125&&d>1){b.x+=(p.x-b.x)/d*100*dt;b.y+=(p.y-b.y)/d*100*dt;}
        }
        if(Math.hypot(p.x-b.x,p.y-b.y)<p.r+19){
          const type=b.type;
          if(type==='heal'){p.hp=Math.min(p.mh,p.hp+45);announce('💚 +45 PV','#7dff9a');}
          else if(type==='shield'){p.sh=Math.min((p.sh||0)+35,70);announce('🛡️ +35 BOUCLIER','#65dcff');}
          else if(type==='speed'){p.buffs=p.buffs||{};p.buffs.speed=8;announce('⚡ VITESSE ×1,5 · 8 s','#ffe66b');}
          else if(type==='rage'){p.buffs=p.buffs||{};p.buffs.rage=8;announce('🔥 DÉGÂTS +35 % · 8 s','#ff9a55');}
          else if(type==='magnet'){p.buffs=p.buffs||{};p.buffs.magnet=10;announce('🧲 AIMANT À GELÉES · 10 s','#c99bff');}
          else if(type==='crate'){p.hp=Math.min(p.mh,p.hp+25);p.sh=Math.min((p.sh||0)+20,70);p.sup=Math.min(1,(p.sup||0)+.3);g.pg=(g.pg||0)+2;announce('🎁 CAISSE : soin, bouclier et 2 gelées !','#ffd36b');}
          p.buffs=p.buffs||{};
          if(p.buffs.speed>0)p.buffs.speed=Math.max(0,p.buffs.speed-dt);
          if(p.buffs.rage>0)p.buffs.rage=Math.max(0,p.buffs.rage-dt);
          if(p.buffs.magnet>0)p.buffs.magnet=Math.max(0,p.buffs.magnet-dt);
          if(p.isP){g.matchStats=g.matchStats||{pickups:0};g.matchStats.pickups++;sfx('gem');}
          g.bonus.splice(i,1);break;
        }
      }
    }
    // Les pouvoirs temporaires diminuent même lorsque le joueur ne ramasse rien.
    for(const p of g.P){if(!p.buffs)p.buffs={};for(const k of ['speed','rage','magnet'])p.buffs[k]=Math.max(0,(p.buffs[k]||0)-dt);if(p.streakTimer>0){p.streakTimer-=dt;if(p.streakTimer<=0)p.streak=0;}}
    // Aimant : attire aussi les gelées déjà au sol.
    for(const p of g.P)if(p.al&&p.buffs?.magnet>0)for(const m of g.gm){
      const d=Math.hypot(p.x-m.x,p.y-m.y);
      if(d>p.r+12&&d<175){m.x+=(p.x-m.x)/d*150*dt;m.y+=(p.y-m.y)/d*150*dt;}
    }
    // Événement de match toutes les 45 secondes : pluie de gelées bonus.
    g.eventClock=(g.eventClock??42)-dt;
    if(g.eventClock<=0){
      g.eventClock=45;g.eventNo=(g.eventNo||0)+1;
      for(let n=0;n<5;n++){const a=rnd(0,6.283),d=rnd(70,430);g.gm.push({x:CX+Math.cos(a)*d,y:CY+Math.sin(a)*d,ph:rnd(0,6)});}
      eventText='🌟 PLUIE DE GELÉES !';eventBanner=3;
      announce(eventText,'#ffe66b');sfx('gem');
    }
  };
  draw=function(now){
    oldDraw(now);
    if(!g)return;
    // Objets bonus dans l'arène.
    if(mode==='play'&&g.bonus?.length){
      const p=g.P[0],scale=Math.min(W,H)/460,cam=p?.al?p:(g.P.find(x=>x.al&&x.t===0)||p);
      if(cam){
        ctx.save();ctx.translate(W/2,H/2);ctx.scale(scale,scale);ctx.translate(-cam.x,-cam.y);
        for(const b of g.bonus){
          const q=TYPES[b.type]||TYPES.crate,sz=15+Math.sin(b.ph)*2;
          ctx.globalAlpha=Math.min(1,b.t/2);
          ctx.fillStyle=q.color+'33';ctx.beginPath();ctx.arc(b.x,b.y,sz+9,0,6.283);ctx.fill();
          ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(b.x,b.y,sz,0,6.283);ctx.fill();
          ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillStyle='#182332';ctx.fillText(q.icon,b.x,b.y+6);
        }
        ctx.restore();
      }
    }
    // Hors partie, ne pas laisser le HUD recouvrir les menus de résultat.
    if(mode!=='play'){
      if(confetti.length){
        ctx.save();
        for(const q of confetti){q.x+=q.vx/60;q.y+=q.vy/60;q.t-=1/60;ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.r,q.r*1.8);}
        confetti=confetti.filter(q=>q.t>0&&q.y<H+20);ctx.restore();
      }
      return;
    }
    // HUD, mini-carte et alertes.
    ctx.save();
    const p=g.P[0],alive=g.P.filter(x=>x.al).length,elapsed=Math.floor(g.t||0);
    ctx.textAlign='left';ctx.font='bold 12px Fredoka,sans-serif';
    const box=(x,y,w,h)=>{ctx.fillStyle='rgba(5,22,38,.78)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='rgba(255,255,255,.22)';ctx.strokeRect(x,y,w,h);};
    box(10,10,124,47);
    ctx.fillStyle='#fff';ctx.fillText('⏱ '+Math.floor(elapsed/60)+':'+String(elapsed%60).padStart(2,'0'),19,28);
    ctx.fillText('👥 '+alive+' survivants',19,47);
    box(10,63,124,31);
    ctx.fillStyle='#ffe66b';ctx.fillText('⚔ '+(p?.k||0)+' éliminations',19,83);
    // Mini-carte 104x104.
    const mw=Math.min(112,Math.max(82,W*.23)),mx=W-mw-12,my=12,sc=mw/(WR*2);
    box(mx,my,mw,mw);
    ctx.save();ctx.beginPath();ctx.rect(mx+4,my+4,mw-8,mw-8);ctx.clip();
    ctx.fillStyle='#4fcf8a';ctx.beginPath();ctx.arc(mx+mw/2,my+mw/2,WR*sc,0,6.283);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(mx+mw/2,my+mw/2,Math.max(3,g.R*sc),0,6.283);ctx.stroke();
    for(const q of g.P){if(!q.al)continue;ctx.fillStyle=q.isP?'#fff':(q.t===0?'#45d9ff':'#ff6379');ctx.beginPath();ctx.arc(mx+mw/2+(q.x-CX)*sc,my+mw/2+(q.y-CY)*sc,q.isP?3.5:2.5,0,6.283);ctx.fill();}
    for(const b of g.bonus||[]){ctx.fillStyle=(TYPES[b.type]||TYPES.crate).color;ctx.fillRect(mx+mw/2+(b.x-CX)*sc-2,my+mw/2+(b.y-CY)*sc-2,4,4);}
    ctx.restore();
    // Barre de vie et états du joueur.
    if(p){
      const pct=Math.max(0,p.hp/p.mh),barW=Math.min(210,W*.42),bx=(W-barW)/2,by=H-24;
      ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(bx,by,barW,10);
      ctx.fillStyle=pct>.5?'#b6ff5c':pct>.25?'#ffb23d':'#ff4d4d';ctx.fillRect(bx,by,barW*pct,10);
      ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(bx,by,barW,10);
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('❤️ '+Math.ceil(p.hp)+' / '+Math.ceil(p.mh)+' PV'+(p.sh>0?'  🛡 '+Math.ceil(p.sh):''),W/2,by-5);
      const buffs=[];
      if(p.buffs?.speed>0)buffs.push('⚡ '+Math.ceil(p.buffs.speed)+'s');
      if(p.buffs?.rage>0)buffs.push('🔥 '+Math.ceil(p.buffs.rage)+'s');
      if(p.buffs?.magnet>0)buffs.push('🧲 '+Math.ceil(p.buffs.magnet)+'s');
      if(buffs.length){ctx.fillStyle='#fff';ctx.fillText(buffs.join('   '),W/2,by-22);}
    }
    // Avertissement de marée.
    if(g.tide&&g.R<300){ctx.textAlign='center';ctx.font='bold 14px Fredoka,sans-serif';ctx.fillStyle='#ffdb70';ctx.fillText('⚠️ LA MARÉE SE RAPPROCHE !',W/2,Math.max(112,H*.16));}
    if(streakBanner>0){ctx.textAlign='center';ctx.font='bold 20px Fredoka,sans-serif';ctx.fillStyle='#ffe66b';ctx.fillText(streakText,W/2,H*.25);}
    if(eventBanner>0){ctx.textAlign='center';ctx.font='bold 17px Fredoka,sans-serif';ctx.fillStyle='#fff';ctx.fillText(eventText,W/2,H*.31);}
    if(hitFlash>0){ctx.fillStyle='rgba(255,45,65,'+(hitFlash*1.1)+')';ctx.fillRect(0,0,W,H);}
    if(p?.al&&p.hp/p.mh<.25){ctx.fillStyle='rgba(255,25,45,'+(0.08+Math.sin(Date.now()/110)*.06)+')';ctx.fillRect(0,0,W,H);}
    ctx.restore();
    // Confettis de victoire.
    if(confetti.length){
      ctx.save();
      for(const q of confetti){q.x+=q.vx/60;q.y+=q.vy/60;q.t-=1/60;ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.r,q.r*1.8);}
      confetti=confetti.filter(q=>q.t>0&&q.y<H+20);ctx.restore();
    }
  };
})();

/* === CORRECTIF VISIBILITÉ CONQUÊTE : BASES IMPOSSIBLES À MANQUER === */
(function(){
  const grBaseStart=startGame;
  startGame=function(){
    grBaseStart();
    if(g && (g.md==='conquest'||S.m==='conquest')){
      g.md='conquest';
      g.tm=true;g.tide=false;g.ts=1e9;g.N=2;
      if(!Array.isArray(g.bases)||g.bases.length!==2){
        g.bases=[
          {team:0,x:CX-620,y:CY,hp:1800,max:1800},
          {team:1,x:CX+620,y:CY,hp:1800,max:1800}
        ];
      }
    }
  };
  const grBaseDraw=draw;
  draw=function(now){
    grBaseDraw(now);
    if(!g || !(g.md==='conquest'||S.m==='conquest') || !W || !H)return;
    // Recrée les bases si une ancienne sauvegarde ou un mode wrapper les a omises.
    if(!Array.isArray(g.bases)||g.bases.length!==2){
      g.bases=[
        {team:0,x:CX-620,y:CY,hp:1800,max:1800},
        {team:1,x:CX+620,y:CY,hp:1800,max:1800}
      ];
    }
    // Affichage fixe au premier plan : visible quelle que soit la caméra.
    const panelW=Math.min(205,Math.max(132,(W-42)/2));
    const gap=12, total=panelW*2+gap, left=(W-total)/2, top=Math.max(8,Math.min(18,H*.025));
    const items=[
      {b:g.bases.find(b=>b.team===0),x:left,color:'#32bfff',title:'TA BASE'},
      {b:g.bases.find(b=>b.team===1),x:left+panelW+gap,color:'#ff536f',title:'BASE ENNEMIE'}
    ];
    ctx.save();
    for(const item of items){
      const b=item.b;if(!b)continue;
      const x=item.x,y=top,w=panelW,h=78;
      ctx.fillStyle='rgba(7,15,31,.96)';ctx.fillRect(x,y,w,h);
      ctx.lineWidth=3;ctx.strokeStyle=item.color;ctx.strokeRect(x,y,w,h);
      // Icône de château dessinée en formes canvas (pas de police emoji requise).
      const cx=x+28,cy=y+40;
      ctx.fillStyle=item.color;
      ctx.fillRect(cx-19,cy-11,38,27);
      ctx.fillRect(cx-23,cy-22,10,15);ctx.fillRect(cx-5,cy-28,10,21);ctx.fillRect(cx+13,cy-22,10,15);
      ctx.fillStyle='#101a2b';ctx.fillRect(cx-4,cy+3,8,13);
      ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 13px Fredoka,sans-serif';
      ctx.fillText(item.title,x+55,y+22);
      ctx.font='bold 12px Fredoka,sans-serif';ctx.fillText(Math.ceil(b.hp)+' / '+b.max+' PV',x+55,y+41);
      ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x+55,y+50,w-66,11);
      ctx.fillStyle=item.color;ctx.fillRect(x+55,y+50,(w-66)*Math.max(0,b.hp/b.max),11);
    }
    ctx.textAlign='center';ctx.font='bold 13px Fredoka,sans-serif';
    ctx.fillStyle='#fff';ctx.fillText('🏰 DÉTRUIS LA BASE ENNEMIE POUR GAGNER',W/2,top+97);
    ctx.restore();
  };
})();



/* === CONQUÊTE : TIRS SUR LES BASES ET DÉGÂTS VISIBLES === */
(function(){
  const grConquestFire=fire;
  fire=function(s){
    if(g&&g.md==='conquest'&&Array.isArray(g.bases)&&s&&s.al){
      const target=g.bases.find(b=>b.team!==s.t);
      if(target){
        const dist=Math.hypot(target.x-s.x,target.y-s.y);
        const stats=B[s.bi];
        // Portée généreuse pour rendre l'objectif atteignable. Un tir disponible
        // touche la base même si un bot adverse est aussi à proximité.
        if(dist<=Math.max(360,stats.rg+150)){
          const manual=s.isP&&S.o.man;
          const firing=!manual||!!(inp.f||keys[S.kb.fire]);
          if(firing){
            s.cd=stats.rt*(s.fr>0?.35:1);
            const dx=target.x-s.x,dy=target.y-s.y,d=Math.hypot(dx,dy)||1;
            s.fx=dx/d;s.fy=dy/d;
            const damage=stats.dm*(s.isP?1.5:1)*(1+.07*(s.lvl||0))*(s.fr>0?1.4:1);
            target.hp=Math.max(0,target.hp-damage);
            g.baseHit={team:target.team,x:target.x,y:target.y,t:.35,damage};
            if(s.isP)sfx('shot');
            if(target.hp<=0&&!g.conquestWinner){
              g.conquestWinner=s.t;
              // Le joueur gagne si sa propre équipe (équipe 0) a détruit la base rouge.
              fin(s.t===0,1);
            }
            return;
          }
        }
      }
    }
    return grConquestFire(s);
  };
  const grConquestDraw=draw;
  draw=function(now){
    grConquestDraw(now);
    if(!g||g.md!=='conquest'||!g.bases)return;
    const h=g.baseHit;
    if(h&&h.t>0){
      // Indicateur de dégâts sur le panneau HUD.
      const w=Math.min(205,Math.max(132,(W-42)/2)),gap=12,left=(W-(w*2+gap))/2;
      const x=left+(h.team===0?0:w+gap);
      ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle='#ffdf70';ctx.lineWidth=3;
      ctx.font='bold 17px Fredoka,sans-serif';ctx.textAlign='center';
      ctx.strokeText('-'+Math.ceil(h.damage)+' PV',x+w/2,108);
      ctx.fillText('-'+Math.ceil(h.damage)+' PV',x+w/2,108);
      ctx.restore();
      h.t=Math.max(0,h.t-.016);
    }
  };
})();


/* === MULTIJOUEUR : AUTORITÉ UNIQUE ET ACTIONS CLIENTS === */
(function(){
  const control=window.GRNetControl;
  const diagnostics=window.GROnlineDiagnostics;
  if(!control||!diagnostics||window.GR_NET_FINAL_GUARD_V2)return;
  window.GR_NET_FINAL_GUARD_V2=true;
  let lastInputSent=0,disconnectShown=false;

  // Le client ne calcule jamais les ennemis, projectiles, dégâts, objets, zone ou score.
  // Il ne transmet que ses commandes; chaque état affiché vient de l'hôte.
  const previousUpdate=update;
  update=function(dt){
    const n=diagnostics();
    if(n.active&&!n.host){
      if(mode!=='play'||!g||!g.P||!g.P[0]||n.slot<0)return;
      if(!control.isFresh()){
        if(!disconnectShown){
          disconnectShown=true;
          control.leave();
          g=null;mode='home';
          go('online');
          control.status('Connexion à l’hôte perdue. Rejoins le salon ou demande à l’hôte de relancer la partie.');
        }
        return;
      }
      disconnectShown=false;
      const p=g.P[0];
      input(p);
      const now=Date.now();
      if(now-lastInputSent>=55){
        lastInputSent=now;
        control.sendInput(p.mx,p.my,!!(inp.f||keys[S.kb.fire]),inp.a,!!S.o.man);
      }
      return;
    }
    disconnectShown=false;
    return previousUpdate(dt);
  };

  // Adaptateur final de tir manuel : il passe aussi par les règles spéciales des modes (ex. Conquête).
  const previousFire=fire;
  fire=function(s){
    const n=diagnostics();
    if(n.active&&n.host&&s?.netOwner&&s.netManual){
      if(!s.netFire)return;
      const wasP=s.isP,wasMan=S.o.man,wasF=inp.f,wasA=inp.a;
      s.isP=true;S.o.man=1;inp.f=1;inp.a=Number(s.netAim)||0;
      try{return previousFire(s)}finally{s.isP=wasP;S.o.man=wasMan;inp.f=wasF;inp.a=wasA}
    }
    return previousFire(s);
  };

  // Les émotes et danses des joueurs distants sont jouées par l'hôte puis incluses dans ses snapshots.
  const previousEmote=emote;
  emote=function(i){
    const n=diagnostics();
    if(n.active&&!n.host){
      if(!g||!g.P?.[0]?.al||!Array.isArray(S.em)||!S.em.length)return;
      const k=i===undefined?(g.ei=(g.ei||0)+1):i;
      const emoteIndex=S.em[k%S.em.length];
      const danceNames=['Boogie gelée','Tourbillon','Disco royal'];
      const dance=S.dances?.length?danceNames[S.dances[(g.ei||0)%S.dances.length]%danceNames.length]:'';
      control.sendEmote(emoteIndex,dance);
      return;
    }
    return previousEmote(i);
  };

  // Une partie en ligne ne se met pas en pause sur un seul appareil.
  const previousPause=pause;
  pause=function(){
    const n=diagnostics();
    if(n.active){control.status('Une partie multijoueur ne peut pas être mise en pause individuellement.');return}
    return previousPause();
  };

  // Quitter en tant que client libère son slime; l'hôte le reprend en IA.
  const previousAct=act;
  act=function(a,d){
    const n=diagnostics();
    if(n.active&&!n.host&&(a==='home'||a==='quit')){
      control.leave();
    }
    return previousAct(a,d);
  };

  // Le joueur hôte reste le seul à publier la fin de partie et le résultat officiel.
  window.GRNetControlDiagnostics=()=>({
    ...diagnostics(),
    clientSimulationDisabled:true,
    stateFresh:control.isFresh()
  });
})();

</script>
